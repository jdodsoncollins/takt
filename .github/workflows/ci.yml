name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run doctor
      - run: npm run audit
      - run: npm run check:xcode
      - run: npm run typecheck
      - run: npm test
      - run: npm run prebuild:android
      - run: npm run prebuild:ios
      - run: npm run export:android
      - run: npm run export:ios
      - run: npm run export:web
